openapi: 3.0.3
info:
  title: casino-sim — Casino Management & Loyalty API (READ-ONLY for ResortFlow)
  version: 1.4.0
  description: |
    Simulated casino management system. ResortFlow NEVER places wagers or executes gaming
    transactions. This surface is informational + loyalty only.

    POLICY-CRITICAL: /responsible-gaming/status is authoritative and MUST be consulted
    before ANY gaming-adjacent content is generated AND before the Offer Agent runs
    on ANY turn, regardless of topic. A self-excluded or limit-flagged guest receives
    zero gaming-adjacent content, and the offer tool registry excludes gaming-linked
    offers structurally — not by prompt instruction.

    Jurisdiction differs by tenant: MGV = Nevada (NGCB), MHB = Massachusetts (MGC).
    Mandated messaging is returned by the API and appended deterministically by the
    orchestrator — never generated by a model.
servers:
  - url: http://localhost:9004/casino/v1
  - url: https://apim-resortflow.azure-api.net/casino/v1
security:
  - CasinoBearer: []

paths:
  /responsible-gaming/status:
    get:
      operationId: getResponsibleGamingStatus
      summary: AUTHORITATIVE policy check. Must pass before gaming content or offers.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: guest_id, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [self_excluded, offers_permitted, jurisdiction]
                properties:
                  guest_id: { type: string }
                  jurisdiction: { type: string, enum: [NV, MA] }
                  self_excluded: { type: boolean }
                  exclusion_scope: { type: string, enum: [none, property, statewide], nullable: true }
                  limit_flags:
                    type: array
                    items: { type: string, enum: [deposit_limit, time_limit, cooling_off] }
                  offers_permitted:
                    type: boolean
                    description: When false, Offer Agent must be skipped entirely for this turn.
                  gaming_content_permitted: { type: boolean }
                  mandated_message:
                    type: string
                    description: Jurisdiction-required text. Append verbatim. Do not paraphrase.
                  support_resources:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        contact: { type: string }
                        jurisdiction: { type: string }

  /loyalty/{guest_id}:
    get:
      operationId: getLoyaltyProfile
      summary: Tier, points, comp balance
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: guest_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  guest_id: { type: string }
                  tier: { type: string, enum: [MEMBER, SILVER, GOLD, PLATINUM, CHAIRMAN] }
                  points_balance: { type: integer }
                  comp_dollars: { type: number }
                  tier_expires: { type: string, format: date }
                  entitlements:
                    type: array
                    description: Feeds the entitlement gate — e.g. lounge access, priority dining
                    items: { type: string }

  /loyalty/{guest_id}/offers:
    get:
      operationId: getLoyaltyOffers
      summary: Non-gaming comp offers only (dining, spa, room credit)
      description: |
        Returns ONLY non-gaming offers. Gaming-linked offers are not exposed on this
        endpoint at all — the restriction is structural, not filtered client-side.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: guest_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      type: object
                      properties:
                        offer_id: { type: string }
                        category: { type: string, enum: [dining, spa, room_credit, entertainment, retail] }
                        description: { type: string }
                        value: { type: number }
                        expires: { type: string, format: date }
        '403':
          description: Offers suppressed — responsible gaming flag active

  /floor/games:
    get:
      operationId: listFloorGames
      summary: Informational only — what games exist, where, minimums
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: game_type, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      type: object
                      properties:
                        game_type: { type: string }
                        location_zone: { type: string }
                        table_minimum: { type: number, nullable: true }
                        hours: { type: string }
                  mandated_message: { type: string }

  /tournaments:
    get:
      operationId: listTournaments
      summary: Scheduled tournament information (read-only, no registration via ResortFlow)
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: from_date, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tournaments:
                    type: array
                    items:
                      type: object
                      properties:
                        tournament_id: { type: string }
                        name: { type: string }
                        start: { type: string, format: date-time }
                        buy_in: { type: number }
                        registration_channel:
                          type: string
                          description: Always human/desk — ResortFlow does not register guests.
                  mandated_message: { type: string }

components:
  securitySchemes:
    CasinoBearer:
      type: http
      scheme: bearer
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema: { type: string, enum: [MGV, MHB] }
