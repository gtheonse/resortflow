<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ResortFlow Verification Console</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e8ec; --dim: #93999f; --accent: #5b8def; --ok: #3fbf6f;
    --warn: #e0a63c; --err: #e0553c; --mono: "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; color: var(--accent); }
  header .session { font-family: var(--mono); font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  header input[type=text] { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-family: var(--mono); font-size: 12px; }
  button { background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08101f; font-weight: 600; }
  button.danger { background: var(--err); border-color: var(--err); color: #1a0705; }
  .fault-toolbar { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .fault-toolbar select { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px; font-size: 12px; }
  main { flex: 1; display: flex; overflow: hidden; }
  .chat-col { flex: 1.3; display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; }
  .transcript { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.4; white-space: pre-wrap; }
  .msg.human { align-self: flex-end; background: var(--accent); color: #08101f; }
  .msg.ai { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); }
  .node-trace { align-self: flex-start; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .node-step { display: inline-block; background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; margin: 2px; }
  .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); background: var(--panel); }
  .composer input { flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 13px; }
  .approval-card { align-self: stretch; background: var(--panel2); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .approval-card h4 { margin: 0 0 6px; color: var(--warn); font-size: 12px; }
  .approval-card .actions { display: flex; gap: 8px; margin-top: 8px; }
  .approval-card .countdown { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .inspector-col { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; background: var(--panel); }
  .panel { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .panel h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); }
  .panel .empty { color: var(--dim); font-size: 12px; font-style: italic; }
  .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; border-bottom: 1px dashed var(--border); }
  .row:last-child { border-bottom: none; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
  .badge.ok { background: rgba(63,191,111,0.15); color: var(--ok); }
  .badge.err { background: rgba(224,85,60,0.15); color: var(--err); }
  .badge.warn { background: rgba(224,166,60,0.15); color: var(--warn); }
  .mono { font-family: var(--mono); }
  .hold-card { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; font-size: 12px; }
  .hold-card .ttl { font-family: var(--mono); font-weight: 600; }
  .hold-card .ttl.low { color: var(--err); }
</style>
</head>
<body>
<header>
  <h1>ResortFlow Verification Console</h1>
  <div class="session">
    thread: <span id="thread-id">(none)</span>
    <button id="copy-thread" title="copy thread_id">copy</button>
    <input id="reconnect-input" type="text" placeholder="reconnect: paste thread_id" size="20" />
    <button id="reconnect-btn">reconnect</button>
    <button id="new-session-btn">new session</button>
  </div>
  <div class="fault-toolbar">
    <span style="font-size:11px;color:var(--dim)">fault (next call):</span>
    <select id="fault-domain"></select>
    <select id="fault-value"><option value="">none</option></select>
    <button id="fault-apply">arm</button>
    <span id="fault-pending" class="mono" style="font-size:11px;color:var(--warn)"></span>
  </div>
</header>
<main>
  <div class="chat-col">
    <div class="transcript" id="transcript"></div>
    <div class="composer">
      <input id="text-input" type="text" placeholder="Type a guest message..." />
      <button id="send-btn" class="primary">Send</button>
    </div>
  </div>
  <div class="inspector-col" id="inspector">
    <div class="panel"><h3>Node Execution Order</h3><div id="node-order" class="empty">no turn yet</div></div>
    <div class="panel"><h3>Tool Calls</h3><div id="tool-calls" class="empty">no turn yet</div></div>
    <div class="panel"><h3>Holds</h3><div id="holds" class="empty">no holds</div></div>
    <div class="panel"><h3>Guardrail Verdicts</h3><div id="guardrails" class="empty">no flags</div></div>
    <div class="panel"><h3>Groundedness</h3><div id="groundedness" class="empty">no turn yet</div></div>
    <div class="panel"><h3>Cost / Tokens</h3><div id="cost" class="empty">no turn yet</div></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let threadId = null;
let holdTimers = [];

function setThreadId(id) {
  threadId = id;
  $('thread-id').textContent = id || '(none)';
}

$('copy-thread').onclick = () => { if (threadId) navigator.clipboard.writeText(threadId); };
$('new-session-btn').onclick = () => { setThreadId(null); $('transcript').innerHTML = ''; clearInspector(); };
$('reconnect-btn').onclick = async () => {
  const id = $('reconnect-input').value.trim();
  if (!id) return;
  const res = await fetch(`/api/threads/${id}/state`);
  if (!res.ok) { alert('unknown thread_id'); return; }
  const data = await res.json();
  setThreadId(id);
  $('transcript').innerHTML = '';
  for (const m of data.transcript || []) {
    addMessage(m.role === 'human' ? 'human' : 'ai', m.content);
  }
  renderInspector(data);
  showInterruptCard(data.interrupt);
};

function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = content;
  $('transcript').appendChild(div);
  $('transcript').scrollTop = $('transcript').scrollHeight;
  return div;
}

function addNodeTrace(nodes) {
  const div = document.createElement('div');
  div.className = 'node-trace';
  const label = nodes.length > 1 ? `parallel: ${nodes.join(' + ')}` : nodes[0];
  div.innerHTML = `<span class="node-step">${label}</span>`;
  $('transcript').appendChild(div);
  $('transcript').scrollTop = $('transcript').scrollHeight;
}

function clearInspector() {
  for (const el of ['node-order','tool-calls','holds','guardrails','groundedness','cost']) {
    $(el).className = 'empty'; $(el).textContent = 'no turn yet';
  }
  holdTimers.forEach(clearInterval); holdTimers = [];
}

function renderInspector(summary) {
  // node order
  if (summary.node_order && summary.node_order.length) {
    $('node-order').className = '';
    $('node-order').innerHTML = summary.node_order
      .map(step => `<div class="row"><span>${step.length > 1 ? 'parallel' : 'step'}</span><span class="mono">${step.join(', ')}</span></div>`)
      .join('');
  }

  // tool calls
  const calls = summary.tool_calls || [];
  $('tool-calls').className = calls.length ? '' : 'empty';
  $('tool-calls').innerHTML = calls.length ? calls.map(c => {
    const extra = c.title || c.hold_id || c.confirmation_id || '';
    return `
    <div class="row">
      <span>${c.kind} ${c.domain ? '('+c.domain+')' : ''} ${extra ? `<span style="color:var(--dim)">— ${extra}</span>` : ''}</span>
      <span class="badge ${c.ok ? 'ok' : 'err'}">${c.ok ? 'ok' : (c.error_class || 'error')}</span>
    </div>`;
  }).join('') : 'no tool calls this turn';

  // holds
  const holds = summary.holds || [];
  holdTimers.forEach(clearInterval); holdTimers = [];
  $('holds').className = holds.length ? '' : 'empty';
  if (holds.length) {
    $('holds').innerHTML = holds.map((h, i) => `
      <div class="hold-card">
        <div><b>${h.domain}</b> — ${h.status} <span class="mono" style="color:var(--dim)">${h.hold_id || h.idempotency_key}</span></div>
        <div class="ttl" id="hold-ttl-${i}">${(h.status === 'pending' || h.status === 'held') && h.expires_at ? 'TTL: computing...' : ''}</div>
      </div>`).join('');
    holds.forEach((h, i) => {
      // Feature 010 (FR-034): a countdown only for a hold that is still
      // live — confirmed/released/expired/orphan_released show their
      // final status above with no countdown, ever (this used to run for
      // ANY expires_at regardless of status, including a hold already
      // confirmed).
      if (h.status !== 'pending' && h.status !== 'held') return;
      if (!h.expires_at) return;
      const expiry = new Date(h.expires_at).getTime();
      const tick = () => {
        const remaining = Math.round((expiry - Date.now()) / 1000);
        const el = $(`hold-ttl-${i}`);
        if (!el) return;
        el.textContent = remaining > 0 ? `TTL: ${remaining}s` : 'EXPIRED';
        el.className = 'ttl' + (remaining < 30 ? ' low' : '');
      };
      tick();
      holdTimers.push(setInterval(tick, 1000));
    });
  } else {
    $('holds').textContent = 'no holds';
  }

  // guardrails
  const flags = summary.guardrail_verdicts || [];
  $('guardrails').className = flags.length ? '' : 'empty';
  $('guardrails').innerHTML = flags.length ? flags.map(f => `
    <div class="row"><span>${f.rule}</span><span class="badge warn">${f.disposition}</span></div>`).join('')
    : 'no flags this turn';
  if (summary.escalate) {
    $('guardrails').innerHTML += `<div class="row"><span>ESCALATED</span><span class="badge err">${summary.escalate_reason || ''}</span></div>`;
  }

  // groundedness
  const g = summary.groundedness || {};
  $('groundedness').className = '';
  if (g.status === 'scored') {
    $('groundedness').innerHTML = `<div class="row"><span>score</span><span class="mono">${g.score.toFixed(3)}</span></div>
      <div class="row"><span>judge</span><span class="mono">${g.judge_model} (${g.judge_provider})</span></div>`;
  } else if (g.status === 'not_applicable') {
    $('groundedness').innerHTML = `<span class="empty">not applicable — no retrieved context this turn</span>`;
  } else {
    $('groundedness').innerHTML = `<span class="badge warn">unavailable</span> <span style="color:var(--dim)">${g.reason || ''}</span>`;
  }

  // cost
  const c = summary.cost || {};
  $('cost').className = '';
  $('cost').innerHTML = c.status === 'not_instrumented'
    ? `<span class="badge warn">not instrumented</span> <span style="color:var(--dim)">${c.reason || ''}</span>`
    : JSON.stringify(c);
}

// Dispatches on interrupt.kind -- rendering every interrupt as an approval
// card regardless of which node raised it was the bug (a CLARIFY free-text
// question was shown as "Approve all"/"Decline all"). See
// ui/inspector.py's _classify_interrupt for the two known shapes.
function showInterruptCard(interrupt) {
  if (!interrupt || !interrupt.pending) return;
  if (interrupt.kind === 'clarify') {
    showClarifyCard(interrupt.question);
  } else if (interrupt.kind === 'approval') {
    showApprovalCard(interrupt.approval_scope || '(no scope)');
  } else {
    showUnknownInterruptCard(interrupt.raw);
  }
}

function showApprovalCard(scope) {
  const card = document.createElement('div');
  card.className = 'approval-card';
  card.innerHTML = `
    <h4>Awaiting approval (all-or-nothing — ADR-047)</h4>
    <div>${scope}</div>
    <div class="actions">
      <button class="primary" data-action="approved">Approve all</button>
      <button class="danger" data-action="declined">Decline all</button>
    </div>
    <div class="status" style="margin-top:6px;"></div>
  `;
  $('transcript').appendChild(card);
  $('transcript').scrollTop = $('transcript').scrollHeight;

  card.querySelectorAll('button[data-action]').forEach(btn => {
    btn.onclick = async () => {
      card.querySelectorAll('button').forEach(b => b.disabled = true);
      const statusEl = card.querySelector('.status');
      const action = btn.dataset.action;
      // approved_domains sent as full set / empty per spec, even though the
      // backend routing is all-or-nothing today (ADR-047) -- never fakes
      // granularity the graph can't honor.
      const domains = action === 'approved' ? ALL_DOMAINS.slice() : [];
      const res = await fetch(`/api/threads/${threadId}/approve`, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({action, approved_domains: domains})
      });
      const {receipt_token} = await res.json();
      statusEl.innerHTML = '<span class="badge warn">Confirming...</span>';
      pollReceipt(receipt_token, statusEl, card);
    };
  });
}

function showClarifyCard(question) {
  const card = document.createElement('div');
  card.className = 'approval-card';
  card.innerHTML = `
    <h4>Clarification needed</h4>
    <div>${question || '(no question text)'}</div>
    <div class="actions" style="gap:6px;">
      <input type="text" class="clarify-input" placeholder="Type your answer..."
             style="flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:4px;font-size:12px;" />
      <button class="primary" data-action="submit">Send</button>
    </div>
    <div class="status" style="margin-top:6px;"></div>
  `;
  $('transcript').appendChild(card);
  $('transcript').scrollTop = $('transcript').scrollHeight;

  const input = card.querySelector('.clarify-input');
  const submit = async () => {
    const answer = input.value.trim();
    if (!answer) return;
    card.querySelectorAll('button,input').forEach(el => el.disabled = true);
    const statusEl = card.querySelector('.status');
    addMessage('human', answer);
    const res = await fetch(`/api/threads/${threadId}/clarify`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({answer})
    });
    const {receipt_token} = await res.json();
    statusEl.innerHTML = '<span class="badge warn">Sending...</span>';
    pollReceipt(receipt_token, statusEl, card);
  };
  card.querySelector('button[data-action="submit"]').onclick = submit;
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
}

function showUnknownInterruptCard(raw) {
  const card = document.createElement('div');
  card.className = 'approval-card';
  card.innerHTML = `<h4>Unrecognized interrupt</h4><div class="mono" style="font-size:11px;">${raw || ''}</div>
    <div style="color:var(--dim);font-size:11px;margin-top:6px;">This interrupt shape isn't handled by the console yet -- resume manually or extend ui/inspector.py's _classify_interrupt.</div>`;
  $('transcript').appendChild(card);
  $('transcript').scrollTop = $('transcript').scrollHeight;
}

async function pollReceipt(token, statusEl, card) {
  const res = await fetch(`/api/receipts/${token}`);
  const data = await res.json();
  if (data.status === 'confirming') {
    setTimeout(() => pollReceipt(token, statusEl, card), 1000);
    return;
  }
  if (data.status === 'succeeded') {
    // Feature 010 (FR-035, SC-014): the badge comes from what actually
    // happened THIS turn (`booking_outcome`), never from "the resume
    // finished without raising" — that used to show "Confirmed" after a
    // decline, an expired hold, or a fresh interrupt just as readily as
    // after a real confirmation.
    statusEl.innerHTML = badgeForOutcome(data.result && data.result.booking_outcome);
    renderInspector(data.result);
    if (data.result && data.result.reply) addMessage('ai', data.result.reply);
    if (data.result) showInterruptCard(data.result.interrupt);
  } else {
    statusEl.innerHTML = `<span class="badge err">Failed</span> ${data.error || ''}`;
  }
}

function badgeForOutcome(outcome) {
  const state = outcome && outcome.state;
  const byState = {
    confirmed: '<span class="badge ok">Confirmed</span>',
    held: '<span class="badge warn">Held — not yet confirmed</span>',
    released: '<span class="badge warn">Released</span>',
    handed_off: '<span class="badge warn">Passed to a team member</span>',
    awaiting_input: '<span class="badge warn">Waiting for your input</span>',
    nothing_booked: '<span class="badge ok">Done — nothing booked</span>',
  };
  return byState[state] || '<span class="badge ok">Done</span>';
}

let ALL_DOMAINS = [];
async function loadFaultOptions() {
  const res = await fetch('/api/faults');
  const data = await res.json();
  ALL_DOMAINS = data.domains;
  $('fault-domain').innerHTML = data.domains.map(d => `<option value="${d}">${d}</option>`).join('');
  $('fault-value').innerHTML = '<option value="">none</option>' + data.values.map(v => `<option value="${v}">${v}</option>`).join('');
}
loadFaultOptions();

$('fault-apply').onclick = async () => {
  if (!threadId) { alert('start a session first'); return; }
  const domain = $('fault-domain').value;
  const value = $('fault-value').value || null;
  const res = await fetch('/api/fault', {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({thread_id: threadId, domain, value})
  });
  const data = await res.json();
  $('fault-pending').textContent = 'pending: ' + JSON.stringify(data.pending);
};

async function sendTurn() {
  const text = $('text-input').value.trim();
  if (!text) return;
  $('text-input').value = '';
  addMessage('human', text);
  clearInspector();

  const res = await fetch('/api/turns', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({thread_id: threadId, text})
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += decoder.decode(value, {stream: true});
    const blocks = buf.split('\n\n');
    buf = blocks.pop();
    for (const block of blocks) {
      const lines = block.split('\n');
      const eventLine = lines.find(l => l.startsWith('event: '));
      const dataLine = lines.find(l => l.startsWith('data: '));
      if (!eventLine || !dataLine) continue;
      const event = eventLine.slice(7);
      const data = JSON.parse(dataLine.slice(6));
      handleSSE(event, data);
    }
  }
}

function handleSSE(event, data) {
  if (event === 'thread') {
    setThreadId(data.thread_id);
  } else if (event === 'node') {
    addNodeTrace(data.nodes);
  } else if (event === 'error') {
    addMessage('ai', `[error] ${data.message}`);
  } else if (event === 'final') {
    if (data.reply) addMessage('ai', data.reply);
    renderInspector(data);
    showInterruptCard(data.interrupt);
  }
}

$('send-btn').onclick = sendTurn;
$('text-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendTurn(); });
</script>
</body>
</html>
