name: Nightly Report (Phase 7 eval — nightly tier)

# T044 — contracts/ci-tier-triggers-contract.md: schedule trigger, never
# blocking. Runs eval.drift's multi-run baseline-drift detection
# (eval/drift.py, T043) as a report; red-team/adversarial-style probing is
# intentionally not built here — it maps to FR-016's optional, non-blocking
# platform add-ons, not required infrastructure this feature builds from
# scratch (see eval/runner.py's _run_nightly_tier docstring).

on:
  schedule:
    - cron: "0 8 * * *"  # 08:00 UTC daily
  workflow_dispatch: {}  # manual trigger for on-demand drift checks

jobs:
  nightly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run nightly-tier report
        # Exit code intentionally ignored (`|| true`) — the nightly tier
        # never blocks anything, per FR-019; a failing shell step here would
        # incorrectly mark the workflow run itself as failed for a tier
        # that is report-only by design.
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ secrets.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_JUDGE_DEPLOYMENT_NAME: ${{ secrets.FOUNDRY_JUDGE_DEPLOYMENT_NAME }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
        run: python -m eval.runner --tier nightly || true

      - name: Upload nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-nightly-${{ github.run_id }}
          path: eval/data/reports/nightly-*.json
