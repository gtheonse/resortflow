          - name: Vegetable Spring Rolls
            description: Crispy rolls, napa cabbage, carrot, glass noodle.
            price: "11"
            dietary_tags: [vegetarian, vegan]
      - section: Curries
        items:
          - name: Green Curry Chicken
            description: Thai basil, bamboo shoot, coconut milk, jasmine rice.
            price: "26"
            allergens: [tree_nut]
          - name: Massaman Beef
            description: Slow-braised beef, potato, peanut, cardamom.
            price: "29"
            allergens: [peanut]
      - section: Robata Grill
        items:
          - name: Miso Black Cod
