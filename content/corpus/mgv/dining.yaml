tenant_id: MGV
domain: dining
venues:
  - id: mgv-din-silverline
    name: Silverline Chophouse
    cuisine: American Steakhouse
    dress_code: "Smart casual; collared shirts required, no athletic wear or flip-flops."
    hours: "5:00 PM - 11:00 PM daily"
    location_zone: "Tower 1, Level 2"
    description: >
      Silverline Chophouse is Meridian Grand's flagship steakhouse, built around
      a glass-walled dry-aging room visible from the main dining floor. The
      room seats 140 across dining tables and a twelve-seat chef's counter
      facing the open kitchen. Reservations are recommended on weekends and
      during major convention weeks.
    menu_sections:
      - section: Starters
        items:
          - name: Dry-Aged Beef Tartare
            description: Hand-cut 45-day dry-aged sirloin, quail egg, smoked bone marrow aioli.
            price: "24"
          - name: Charred Octopus
            description: Spanish octopus, chorizo, smoked paprika, fingerling potato.
            price: "22"
            allergens: [shellfish]
      - section: Mains
        items:
          - name: 32oz Tomahawk Ribeye
            description: Bone-in dry-aged ribeye for two, served with bordelaise.
            price: "165"
          - name: Miso-Glazed Chilean Sea Bass
            description: Pan-seared sea bass, miso glaze, bok choy, ginger broth.
            price: "58"
            allergens: [soy, fish]
      - section: Desserts
        items:
          - name: Valrhona Chocolate Souffle
            description: Warm chocolate souffle, vanilla bean anglaise. Allow 20 minutes.
            price: "16"
            allergens: [egg, dairy, gluten]
    valid_from: "2025-01-01"
    valid_to: null
