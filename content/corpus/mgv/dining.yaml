  - id: mgv-din-vault
    name: The Vault Lounge
    cuisine: Small Plates & Cocktails
    dress_code: "Upscale casual after 8 PM; no shorts or sandals after 9 PM."
    hours: "4:00 PM - 2:00 AM daily"
    location_zone: "Casino Level, adjacent to the high-limit gaming salon"
    description: >
      The Vault Lounge occupies the space of a decommissioned cage vault and
      serves craft cocktails and shareable small plates. It is a popular
      pre-show stop for guests headed to the Meridian Grand Theater.
    menu_sections:
      - section: Small Plates
        items:
          - name: Truffle Fries
            description: Hand-cut fries, black truffle, parmesan, herb aioli.
            price: "17"
            allergens: [dairy, egg]
          - name: Wagyu Sliders
            description: Three American wagyu sliders, cheddar, caramelized onion.
            price: "24"
            allergens: [dairy, gluten]
