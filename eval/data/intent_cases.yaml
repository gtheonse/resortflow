# T054 — labelled guest utterances for the deterministic dining-intent metrics
# (`eval/intent_scorer.py`, research R-08, FR-035). Each case's `expected` is the ground truth the
# structured extraction is checked against; `dietary` entries there use `{restriction, severity}`
# only (a wrong `detail` free-text string is never a miss — only the structured pair is checked,
# Principle IV). `today` fixes the date `extract(text, today=...)` is called with, so "tomorrow"
# and "tonight" have deterministic expected `date_str` values.
#
# At least 12 cases per tenant, at least 6 per tenant carrying dietary requirements, and across the
# whole file every `DietaryRestriction` and every `DietarySeverity` value appears at least once
# (checked by `eval/tests/test_intent_cases_data.py`).
today: 2026-01-15

cases:
  # --- MGV (12 cases, 6 with dietary requirements) --------------------------------------------
  - id: mgv-01
    tenant_id: MGV
    text: "Table for 4 tomorrow at 7pm, steakhouse, severe peanut allergy"
    expected:
      cuisine: steakhouse
      party_size: 4
      date_str: "2026-01-16"
      time_str: "19:00"
      dietary:
        - restriction: peanut
          severity: allergy_severe
  - id: mgv-02
