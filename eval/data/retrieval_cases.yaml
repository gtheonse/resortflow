# T024/T025/T055 — fixed retrieval-quality eval set (FR-001/FR-019/FR-021a). The PR tier
# scores a stratified single-run subset (`PR_TIER_SAMPLE_SIZE` cases from
# `eval/runner.py`, one per domain where possible); the merge-queue tier
# scores the full set at 3x-repeat. Kept as a small, hand-curated fixture
# rather than a live RAG pull — this feature scores retrieval quality, it
# does not stand up a queryable corpus; question/answer/context here are
# fixed strings a `FakeJudgeClient`-backed test can score deterministically,
# and a real judge backend is expected to score much the same way.
#
# T055: every case now carries `tenant_id` (MGV/MHB) so `eval/gate.py::evaluate_strata` can gate
# per tenant (SC-016); each tenant has at least 5 cases and at least 1 per domain that has cases.
- id: dining-allergen-01
