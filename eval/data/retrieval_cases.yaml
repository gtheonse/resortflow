    - "Meridian Steakhouse menu note: filet mignon and roasted vegetable plate contain no shellfish."
    - "Kitchen allergen policy: raw bar items carry cross-contact risk for shellfish allergies."
  ground_truth_facts:
    - "Filet mignon and roasted vegetable plate are shellfish-free."
    - "Raw bar items carry cross-contact risk."
