# T041 — 60-question gold eval set, both tenants, all six domains.
# gold_chunk_ids reference content/chunker.py's chunk_id scheme:
#   dining venue overview -> "{venue_id}-overview"
#   dining menu section   -> "{venue_id}-{section-slug}"
#   rooms/entertainment/policies/faq -> the corpus item's own id
#   wellness treatment/offering -> the item's own id (spa/fitness overview
#     chunks use "{tenant}-well-spa-overview" / "{tenant}-well-fitness-overview")
cases:
  # --- MGV: dining (5) ---
  - id: mgv-eval-001
    tenant_id: MGV
    domain: dining
    question: "What is the dress code at Silverline Chophouse?"
    gold_chunk_ids: [mgv-din-silverline-overview]
  - id: mgv-eval-002
    tenant_id: MGV
    domain: dining
    question: "What steak options does Silverline Chophouse serve and how much does the tomahawk ribeye cost?"
    gold_chunk_ids: [mgv-din-silverline-mains]
  - id: mgv-eval-003
