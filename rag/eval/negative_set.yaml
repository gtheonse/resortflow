# T043 — Availability-style questions. These ask about live vendor state
# (table/room/spa-slot availability "tonight"/"this weekend") that is never
# in the static content corpus by design — plan.md's "Why Qdrant Payload
# Filtering?" section and AGENTS.md's ambiguity-based routing both treat
# availability as tool/vendor state, not retrievable knowledge. A non-empty
# result here is a chunking/retrieval bug (the corpus should never contain
# a chunk that answers these), not a recall miss.
