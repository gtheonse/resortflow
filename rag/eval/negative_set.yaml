# Feature 010 (research R-11, ADR-057) -- OFF-TOPIC questions: not availability-style (they do
# NOT trigger rag.retriever.is_availability_query's deterministic short-circuit above), and not
# a resort service at all. These calibrate `knowledge_relevance_floor`
# (rag/eval/calibrate_floor.py): unlike the availability cases above, a cross-encoder score CAN
# separate these from the static corpus cleanly, because the content genuinely isn't topically
# related (research R-11 -- the prior score-threshold failure was specific to availability
# questions, which this section deliberately does not repeat).
