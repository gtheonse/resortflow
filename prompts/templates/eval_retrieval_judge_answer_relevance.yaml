# The answer-relevance judge prompt (ADR-052/053; migrated verbatim from
# eval/retrieval_scorer.py::_SYSTEM_PROMPT and score_answer_relevance's user f-string, T046).
#
# `resolution: exact` -- see eval_retrieval_judge_context_recall.yaml's header comment for why judge prompts
# never resolve from the registry.
#
# Owner: eval_track. Pinned byte-for-byte by prompts/tests/test_judge_templates.py against
# prompts/tests/golden/judge_prompts.json.
id: eval_retrieval_judge_answer_relevance
family: eval_retrieval_judge
type: chat
resolution: exact
owner: eval_track
config:
  temperature: 0
variables:
  runtime:
    - question
    - answer
  tenant: []
messages:
  - role: system
    content: "You are a strict evaluation judge for a hospitality RAG system. Respond with ONLY a JSON object of the shape {\"score\": <float 0.0-1.0>, \"reasoning\": \"<one sentence>\"}. No prose outside the JSON."
  - role: user
    content: "Guest question: {{question}}\n\nAnswer given: {{answer}}\n\nScore ANSWER RELEVANCE: how directly and completely does the answer address what the guest actually asked, ignoring style? 1.0 = fully addresses it; 0.0 = off-topic or non-responsive."
