# The faithfulness judge prompt (ADR-052/053; migrated verbatim from
# eval/retrieval_scorer.py::_SYSTEM_PROMPT and score_faithfulness's user f-string, T046).
#
# `resolution: exact` -- see eval_retrieval_judge_context_recall.yaml's header comment for why judge prompts
# never resolve from the registry.
#
# Owner: eval_track. Pinned byte-for-byte by prompts/tests/test_judge_templates.py against
# prompts/tests/golden/judge_prompts.json.
id: eval_retrieval_judge_faithfulness
family: eval_retrieval_judge
type: chat
resolution: exact
owner: eval_track
config:
  temperature: 0
variables:
  runtime:
    - answer
    - context_block
  tenant: []
messages:
  - role: system
    content: "You are a strict evaluation judge for a hospitality RAG system. Respond with ONLY a JSON object of the shape {\"score\": <float 0.0-1.0>, \"reasoning\": \"<one sentence>\"}. No prose outside the JSON."
  - role: user
    content: "Answer given to the guest:\n{{answer}}\n\nRetrieved context it should be grounded in:\n{{context_block}}\n\nScore FAITHFULNESS: what fraction of the factual claims in the answer are directly supported by the retrieved context (not the judge's own outside knowledge)? 1.0 = every claim is grounded; 0.0 = the answer is unsupported or contradicts the context."
